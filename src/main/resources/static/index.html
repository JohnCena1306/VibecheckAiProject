<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vibecheck</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>vibecheck</h1>

<form id="form">

    <p class="sentence">Play me some

        <label for="genre" class="hidden-label">genre</label>
        <select id="genre" required>
            <option value="" disabled selected hidden>genre</option>
            <option value="POP">pop</option>
            <option value="RNB">r&b</option>
            <option value="RAP">rap</option>
            <option value="ELECTRONIC">electronic</option>
            <option value="JAZZ">jazz</option>
            <option value="INDIE">indie</option>
            <option value="COUNTRY">country</option>
            <option value="ROCK">rock</option>
            <option value="METAL">metal</option>
        </select>

        that feels

        <label for="mood" class="hidden-label">mood</label>
        <select id="mood" required>
            <option value="" disabled selected hidden>mood</option>
            <option value="HAPPY">happy</option>
            <option value="SAD">sad</option>
            <option value="CHILL">chill</option>
            <option value="ANGRY">angry</option>
            <option value="ENERGETIC">energetic</option>
            <option value="ROMANTIC">romantic</option>
            <option value="NOSTALGIC">nostalgic</option>
            <option value="FOCUSED">focused</option>
        </select>,

        lately I've been into

        <label for="artists" class="hidden-label">Artists you have been listening to</label>
        <input id="artists" placeholder="this artist or band" required>
    </p>

    <button type="submit">vibecheck it</button>
</form>

<div id="result"></div>

<script src="js/main.js"></script>
</body>
</html>
